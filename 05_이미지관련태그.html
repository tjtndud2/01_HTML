<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
        이미지를 삽입하기 위해서는 <img> 태그 활용

        img 태그 주요 속성
        - src : 어떤 이미지 파일을 읽을지 경로를 기술하는 속성
        - alt : 단순 설명하는 속성 (결과창에서는 보이지 않음. 오류창에서 뜸)
    -->
    <h1>이미지 관련 태그</h1>
    <img src="sample/image/city1.PNG" alt="도시">
    <p>
        src 속성은 우리가 부르고 싶은 이미지 파일의 경로를 기술함
        <br>
        alt 속성은 사진 경로, 사진을 읽을 수 없을 때 대체할 수 있는 텍스트 역할함
    </p>
    <hr>
    <h3>width 속성과 height 속성</h3>
    <p>가변 크기와 고정 크기</p>
    <h4>고정 크기</h4>
    <p>화면의 크기가 변경 되어도 변하지 않는다</p>
    <img src="sample/image/flower1.PNG" width="200px" height="100px">
    <img src="sample/image/flower2.PNG" width="200px" height="100px">
    <img src="sample/image/flower3.PNG" width="200px" height="100px">

    <h4>가변 크기</h4>
    <p>화면의 크기에 따라 사이즈가 변경된다.</p>
    <img src="sample/image/flower1.PNG" width="20%" height="100px">
    <img src="sample/image/flower2.PNG" width="20%" height="100px">
    <img src="sample/image/flower3.PNG" width="20%" height="100px">

    

</body>
</html>
